<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trajectory</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; touch-action: none; font-family: Arial, Helvetica, sans-serif; }
body { overscroll-behavior: none; }
#game { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #000; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

/* HUD */
.hud { position: absolute; z-index: 5; top: 0; left: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: env(safe-area-inset-top) 20px 0 20px; border-bottom: 1px solid #151515; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand-dot { width: 7px; height: 7px; border-radius: 50%; background: #00ff91; box-shadow: 0 0 14px #00ff91; }
.brand-text { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.stats { display: flex; gap: 18px; }
.stat { text-align: right; }
.stat-label { color: #444; font-size: 7px; letter-spacing: 1.5px; margin-bottom: 4px; text-transform: uppercase; }
.stat-value { font-family: monospace; font-size: 13px; }

/* NEW: difficulty + sound bar */
.toolbar { position: absolute; z-index: 12; top: calc(80px + env(safe-area-inset-top)); left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
.levels { display: flex; border: 1px solid #202020; pointer-events: auto; }
.level, .mute { background: transparent; color: #555; border: 0; font-family: monospace; font-size: 9px; letter-spacing: 2px; padding: 8px 12px; cursor: pointer; text-transform: uppercase; }
.level + .level { border-left: 1px solid #202020; }
.level.active { color: #000; background: #fff; }
.level:disabled { cursor: not-allowed; opacity: .5; }
.mute { border: 1px solid #202020; pointer-events: auto; min-width: 74px; }
.mute.on { color: #00ff91; }

/* Desktop control panel */
.controls { position: absolute; z-index: 10; left: 25px; bottom: 25px; width: 255px; padding: 18px; background: rgba(0,0,0,.9); border: 1px solid #202020; }
.title { color: #555; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 17px; }
.row { margin-bottom: 16px; }
.row-head { display: flex; justify-content: space-between; margin-bottom: 7px; }
.label { color: #888; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
.value { font-family: monospace; font-size: 11px; }
input[type="range"] { width: 100%; height: 3px; appearance: none; background: #282828; outline: none; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #fff; }
.fire { width: 100%; height: 44px; border: 1px solid #555; background: #fff; color: #000; font-size: 9px; font-weight: bold; letter-spacing: 3px; cursor: pointer; }
.fire:active { transform: scale(.97); }

/* Mobile instructions */
.mobile-hint { position: absolute; z-index: 6; left: 50%; top: calc(125px + env(safe-area-inset-top)); transform: translateX(-50%); width: 90%; text-align: center; color: #444; font-family: monospace; font-size: 8px; letter-spacing: 1px; line-height: 1.8; pointer-events: none; transition: opacity .4s; }
.mobile-hint.hidden { opacity: 0; }

/* Message */
.message { position: absolute; z-index: 20; left: 50%; top: 45%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .15s; }
.message.show { opacity: 1; }
.message-main { font-size: 34px; font-weight: 300; letter-spacing: 8px; }
.message-sub { margin-top: 8px; color: #555; font-family: monospace; font-size: 8px; letter-spacing: 2px; }

/* Equation */
.equation { position: absolute; right: 25px; bottom: 28px; color: #292929; font-family: Georgia, serif; font-size: 17px; font-style: italic; pointer-events: none; }

@media (max-width: 700px) {
    .hud { height: 62px; padding-left: 15px; padding-right: 15px; }
    .brand-text { font-size: 9px; letter-spacing: 3px; }
    .stats { gap: 10px; }
    .stat-label { font-size: 6px; }
    .stat-value { font-size: 11px; }
    .toolbar { top: calc(72px + env(safe-area-inset-top)); left: 15px; right: 15px; }
    .level, .mute { padding: 8px 10px; letter-spacing: 1px; }
    .controls, .equation { display: none; }
    .mobile-hint { display: block; top: calc(115px + env(safe-area-inset-top)); }
}
@media (min-width: 701px) {
    .mobile-hint { display: none; }
}
</style>
</head>
<body>
<div id="game">
    <canvas id="canvas"></canvas>

    <div class="hud">
        <div class="brand">
            <div class="brand-dot"></div>
            <div class="brand-text">Trajectory</div>
        </div>
        <div class="stats">
            <div class="stat"><div class="stat-label">Score</div><div class="stat-value" id="score">0000</div></div>
            <div class="stat"><div class="stat-label">Streak</div><div class="stat-value" id="streak">00</div></div>
            <div class="stat"><div class="stat-label">Accuracy</div><div class="stat-value" id="accuracy">100%</div></div>
        </div>
    </div>

    <!-- NEW: difficulty selector and sound toggle -->
    <div class="toolbar">
        <div class="levels" id="levels">
            <button class="level" data-level="easy">Easy</button>
            <button class="level" data-level="normal">Normal</button>
            <button class="level" data-level="hard">Hard</button>
        </div>
        <button class="mute on" id="mute">♪ ON</button>
    </div>

    <div class="mobile-hint" id="mobileHint">
        TOUCH THE BOW AND PULL BACK<br>
        PULL FURTHER FOR MORE POWER · ARROW FLIES OPPOSITE YOUR PULL<br>
        RELEASE TO FIRE
    </div>

    <div class="controls">
        <div class="title">Projectile Parameters</div>
        <div class="row">
            <div class="row-head"><span class="label">Angle θ</span><span class="value" id="angleValue">45.0°</span></div>
            <input id="angle" type="range" min="8" max="82" step=".1" value="45">
        </div>
        <div class="row">
            <div class="row-head"><span class="label">Velocity</span><span class="value" id="velocityValue">850</span></div>
            <input id="velocity" type="range" min="350" max="1800" step="10" value="850">
        </div>
        <button class="fire" id="fire">FIRE ARROW</button>
    </div>

    <div class="message" id="message">
        <div class="message-main" id="messageMain">HIT</div>
        <div class="message-sub" id="messageSub">trajectory confirmed</div>
    </div>
</div>

<script>
/* =========================================================
   CANVAS
========================================================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W = innerWidth;
let H = innerHeight;

/* =========================================================
   PHYSICS
========================================================= */
const GRAVITY = 430;
const MIN_VELOCITY = 350;
const MAX_VELOCITY = 1800;
const MIN_ANGLE = 8;
const MAX_ANGLE = 82;

const launcher = { x: 110, y: 0 };
const target = { x: 0, y: 0, baseY: 0, radius: 10, phase: 0 };

/* =========================================================
   NEW: DIFFICULTY LEVELS
   ---------------------------------------------------------
   radiusScale  : target size multiplier
   previewTime  : seconds of flight shown by the dotted line
   moveAmp      : vertical target movement in px (0 = still)
   moveSpeed    : target movement speed
   multiplier   : score multiplier
========================================================= */
const DIFFICULTY = {
    easy:   { radiusScale: 1.5,  previewTime: 5,   moveAmp: 0,  moveSpeed: 0,   multiplier: 1 },
    normal: { radiusScale: 1,    previewTime: .45, moveAmp: 0,  moveSpeed: 0,   multiplier: 2 },
    hard:   { radiusScale: .75,  previewTime: .15, moveAmp: 45, moveSpeed: 1.6, multiplier: 3 }
};

let level = "normal";
try {
    const saved = localStorage.getItem("trajectory-level");
    if (saved && DIFFICULTY[saved]) level = saved;
} catch (e) {}

function settings() {
    return DIFFICULTY[level];
}

/* =========================================================
   GAME STATE
========================================================= */
let arrow = null;
let score = 0, streak = 0, shots = 0, hits = 0;
let particles = [];
let targetFlash = 0;
let locked = false;
let lastTime = performance.now();
let clock = 0;

/* =========================================================
   MOBILE DRAG STATE
========================================================= */
let touching = false;
let currentTouchX = 0;
let currentTouchY = 0;

const AIM_ACTIVE_RADIUS = 135;
const MAX_DRAW_DISTANCE = AIM_ACTIVE_RADIUS;
const AIM_DEAD_ZONE = 14;

let aimActive = false;
let lastValidAngle = 45;
let lastValidVelocity = 850;
let lastPowerStep = -1;

/* =========================================================
   NEW: SOUND (Web Audio, no files)
   ---------------------------------------------------------
   Every sound is a few oscillator notes or one tiny noise
   burst. The audio context starts on the first tap or key,
   as browsers require.
========================================================= */
let audio = null;
let noiseBuffer = null;
let soundOn = true;
try {
    soundOn = localStorage.getItem("trajectory-sound") !== "off";
} catch (e) {}

function unlockAudio() {
    if (!soundOn) return;
    if (!audio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audio = new AC();

        // 0.25 s of white noise, reused for the whoosh
        noiseBuffer = audio.createBuffer(1, audio.sampleRate * .25, audio.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audio.state === "suspended") audio.resume();
}
["pointerdown", "touchend", "keydown", "click"].forEach(type =>
    window.addEventListener(type, unlockAudio, { passive: true })
);

/* One short note with a pitch slide and quick fade. */
function tone(type, fromHz, toHz, duration, volume, delay = 0) {
    if (!soundOn || !audio || audio.state !== "running") return;
    const t = audio.currentTime + delay;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(fromHz, t);
    osc.frequency.exponentialRampToValueAtTime(toHz, t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(.0001, t + duration);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + duration + .02);
}

const sfx = {
    // soft tick as the string passes each 10% of power
    tick(step) { tone("sine", 500 + step * 70, 480 + step * 70, .03, .04); },

    // bowstring twang on release, brighter with more power
    twang(power) {
        tone("triangle", 220 + power * 120, 90, .18, .22);
        sfx.whoosh();
    },

    // quiet air swish
    whoosh() {
        if (!soundOn || !audio || audio.state !== "running") return;
        const t = audio.currentTime;
        const src = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const gain = audio.createGain();
        src.buffer = noiseBuffer;
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1800, t);
        filter.frequency.exponentialRampToValueAtTime(500, t + .25);
        gain.gain.setValueAtTime(.08, t);
        gain.gain.exponentialRampToValueAtTime(.0001, t + .25);
        src.connect(filter).connect(gain).connect(audio.destination);
        src.start(t);
    },

    // two-note chime; pitch rises with the streak
    hit(streakCount) {
        const lift = Math.pow(1.06, Math.min(streakCount, 8));
        tone("sine", 880 * lift, 870 * lift, .12, .18);
        tone("sine", 1320 * lift, 1310 * lift, .2, .14, .07);
    },

    // low falling thud
    miss() { tone("sine", 160, 60, .25, .25); },

    // short buzz for an invalid release
    denied() { tone("square", 110, 100, .09, .05); },

    // UI click
    click() { tone("sine", 1000, 900, .04, .06); }
};

/* =========================================================
   RESIZE
========================================================= */
function resize() {
    W = innerWidth;
    H = innerHeight;

    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (W < 700) {
        launcher.x = Math.max(AIM_ACTIVE_RADIUS + 15, W * .22);
        launcher.y = H - (AIM_ACTIVE_RADIUS + 15);
    } else {
        launcher.x = 110;
        launcher.y = H - 145;
    }

    placeTarget();
}
window.addEventListener("resize", resize);

/* =========================================================
   TARGET
========================================================= */
function placeTarget() {
    const s = settings();

    let minX;
    if (W < 700) minX = Math.max(W * .52, launcher.x + 90);
    else minX = Math.max(350, W * .38);
    const maxX = Math.max(minX + 20, W - 45);

    target.x = minX + Math.random() * (maxX - minX);

    // CHANGED: leave room for vertical movement on hard
    const topY = 140 + s.moveAmp;
    const range = Math.max(35, H - 300 - s.moveAmp * 2);
    target.baseY = topY + Math.random() * range;
    target.y = target.baseY;
    target.phase = Math.random() * Math.PI * 2;

    target.radius = (W < 700 ? 11 : 9) * s.radiusScale;
}

/* NEW: moves the target on hard */
function updateTarget() {
    const s = settings();
    target.y = target.baseY + Math.sin(clock * s.moveSpeed + target.phase) * s.moveAmp;
}

/* =========================================================
   NEW: DIFFICULTY + SOUND BUTTONS
========================================================= */
const levelButtons = document.querySelectorAll(".level");
const muteButton = document.getElementById("mute");

function refreshToolbar() {
    levelButtons.forEach(b => {
        b.classList.toggle("active", b.dataset.level === level);
        b.disabled = !!arrow;
    });
    muteButton.textContent = soundOn ? "♪ ON" : "♪ OFF";
    muteButton.classList.toggle("on", soundOn);
}

function setLevel(next) {
    if (arrow || next === level) return;
    level = next;
    try { localStorage.setItem("trajectory-level", level); } catch (e) {}

    // a new level starts a fresh run
    score = 0; streak = 0; shots = 0; hits = 0;
    updateStats();
    placeTarget();
    refreshToolbar();
    sfx.click();
    showMessage(level.toUpperCase(), `score multiplier ×${settings().multiplier}`);
    setTimeout(hideMessage, 700);
}

levelButtons.forEach(b => b.addEventListener("click", () => {
    setLevel(b.dataset.level);
    b.blur(); // keep Space for firing
}));

function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem("trajectory-sound", soundOn ? "on" : "off"); } catch (e) {}
    if (soundOn) { unlockAudio(); sfx.click(); }
    refreshToolbar();
}
muteButton.addEventListener("click", () => {
    toggleSound();
    muteButton.blur();
});

/* =========================================================
   DESKTOP CONTROLS
========================================================= */
const angleSlider = document.getElementById("angle");
const velocitySlider = document.getElementById("velocity");
const angleValue = document.getElementById("angleValue");
const velocityValue = document.getElementById("velocityValue");

function currentAngle() {
    return touching ? lastValidAngle : Number(angleSlider.value);
}
function currentVelocity() {
    return touching ? lastValidVelocity : Number(velocitySlider.value);
}

function updateControls() {
    angleValue.textContent = currentAngle().toFixed(1) + "°";
    velocityValue.textContent = currentVelocity().toFixed(0);
}
angleSlider.addEventListener("input", updateControls);
velocitySlider.addEventListener("input", updateControls);

/* =========================================================
   MATHEMATICS
========================================================= */
function projectile(t, theta, velocity) {
    const radians = theta * Math.PI / 180;
    return {
        x: launcher.x + velocity * Math.cos(radians) * t,
        y: launcher.y - velocity * Math.sin(radians) * t + .5 * GRAVITY * t * t
    };
}

function smoothstep(n) {
    return n * n * (3 - 2 * n);
}

function powerOf(velocity) {
    return smoothstep(Math.max(0, Math.min(1, (velocity - MIN_VELOCITY) / (MAX_VELOCITY - MIN_VELOCITY))));
}

/* =========================================================
   MOBILE AIMING
========================================================= */
function updateMobileAim(x, y) {
    const dx = x - launcher.x;
    const dy = y - launcher.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > AIM_ACTIVE_RADIUS) {
        aimActive = false;
        return;
    }
    aimActive = true;

    // slingshot: arrow flies opposite to the pull
    if (distance >= AIM_DEAD_ZONE) {
        let theta = Math.atan2(y - launcher.y, launcher.x - x) * 180 / Math.PI;
        lastValidAngle = Math.max(MIN_ANGLE, Math.min(MAX_ANGLE, theta));
    }

    const normalized = Math.max(0, Math.min(1, distance / MAX_DRAW_DISTANCE));
    lastValidVelocity = MIN_VELOCITY + smoothstep(normalized) * (MAX_VELOCITY - MIN_VELOCITY);

    // NEW: tick each time power crosses a 10% step
    const step = Math.floor(powerOf(lastValidVelocity) * 10);
    if (step !== lastPowerStep) {
        if (lastPowerStep !== -1) sfx.tick(step);
        lastPowerStep = step;
    }

    angleSlider.value = lastValidAngle;
    velocitySlider.value = lastValidVelocity;
    updateControls();
}

/* =========================================================
   TOUCH INPUT
========================================================= */
canvas.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
    e.preventDefault();
    if (arrow || locked) return;

    const dx = e.clientX - launcher.x;
    const dy = e.clientY - launcher.y;
    if (Math.sqrt(dx * dx + dy * dy) > AIM_ACTIVE_RADIUS) return;

    touching = true;
    aimActive = true;
    lastPowerStep = -1;
    currentTouchX = e.clientX;
    currentTouchY = e.clientY;

    canvas.setPointerCapture(e.pointerId);
    updateMobileAim(e.clientX, e.clientY);
    document.getElementById("mobileHint").classList.add("hidden");
}, { passive: false });

canvas.addEventListener("pointermove", e => {
    if (!touching) return;
    e.preventDefault();
    currentTouchX = e.clientX;
    currentTouchY = e.clientY;
    updateMobileAim(currentTouchX, currentTouchY);
}, { passive: false });

canvas.addEventListener("pointerup", e => {
    if (!touching) return;
    e.preventDefault();

    if (!aimActive) {
        touching = false;
        angleSlider.value = lastValidAngle;
        velocitySlider.value = lastValidVelocity;
        updateControls();
        sfx.denied();
        showMessage("OUT OF RANGE", "return inside aiming radius");
        setTimeout(hideMessage, 350);
        return;
    }

    shoot();
    touching = false;
    aimActive = false;
    updateControls();
}, { passive: false });

canvas.addEventListener("pointercancel", () => {
    touching = false;
    aimActive = false;
});

/* =========================================================
   DRAW PREDICTION
========================================================= */
function drawPrediction() {
    if (arrow) return;

    const theta = currentAngle();
    const velocity = currentVelocity();
    const maxT = settings().previewTime; // CHANGED: length depends on level

    ctx.save();
    ctx.beginPath();
    let started = false;

    for (let t = 0; t < maxT; t += .025) {
        const p = projectile(t, theta, velocity);
        if (p.x > W + 30 || p.y > H + 30 || p.y < 70) break;
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
    }

    ctx.setLineDash([2, 7]);
    if (touching && !aimActive) ctx.strokeStyle = "rgba(255,49,88,.15)";
    else ctx.strokeStyle = touching ? "rgba(0,255,145,.38)" : "rgba(255,255,255,.18)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
}

/* =========================================================
   BOW
========================================================= */
function drawBow() {
    if (arrow) return;

    const out = touching && !aimActive;
    const theta = currentAngle() * Math.PI / 180;
    const eased = powerOf(currentVelocity());

    const dx = Math.cos(theta);
    const dy = -Math.sin(theta);
    const px = -dy;
    const py = dx;

    const bowLength = 75;
    const curve = 22 + eased * 14;

    const top = { x: launcher.x + px * bowLength, y: launcher.y + py * bowLength };
    const bottom = { x: launcher.x - px * bowLength, y: launcher.y - py * bowLength };
    const pull = 4 + eased * 42;

    const stringPoint = { x: launcher.x - dx * pull, y: launcher.y - dy * pull };
    const bowCenter = {
        x: launcher.x + dx * (curve + eased * 7),
        y: launcher.y + dy * (curve + eased * 7)
    };

    ctx.save();

    // Bow
    if (out) { ctx.shadowColor = "#ff3158"; ctx.shadowBlur = 12; }
    else { ctx.shadowColor = `rgba(255,255,255,${.12 + eased * .25})`; ctx.shadowBlur = 5 + eased * 9; }

    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.quadraticCurveTo(bowCenter.x, bowCenter.y, bottom.x, bottom.y);
    ctx.strokeStyle = out ? "#ff3158" : "#eeeeee";
    ctx.lineWidth = 3 + eased * 1.5;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Bow tips
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(top.x, top.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bottom.x, bottom.y, 3, 0, Math.PI * 2); ctx.fill();

    // String
    const brightness = Math.round(110 + eased * 145);
    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.lineTo(stringPoint.x, stringPoint.y);
    ctx.lineTo(bottom.x, bottom.y);
    ctx.strokeStyle = out ? "#ff3158" : `rgb(${brightness},${brightness},${brightness})`;
    ctx.lineWidth = 1 + eased * .9;
    ctx.stroke();

    // Tension glow
    ctx.shadowColor = out ? "#ff3158" : "#00ff91";
    ctx.shadowBlur = eased * 18;
    ctx.fillStyle = out ? "#ff3158" : eased > .7 ? "#00ff91" : "#fff";
    ctx.beginPath();
    ctx.arc(stringPoint.x, stringPoint.y, 2.5 + eased * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Loaded arrow
    const arrowLength = 73;
    const rearX = stringPoint.x - dx * 5;
    const rearY = stringPoint.y - dy * 5;
    const tipX = stringPoint.x + dx * arrowLength;
    const tipY = stringPoint.y + dy * arrowLength;

    ctx.strokeStyle = out ? "#ff3158" : "#fff";
    ctx.lineWidth = 2.3;
    ctx.beginPath(); ctx.moveTo(rearX, rearY); ctx.lineTo(tipX, tipY); ctx.stroke();

    const headLength = 11, headWidth = 5;
    ctx.fillStyle = out ? "#ff3158" : "#fff";
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - dx * headLength + px * headWidth, tipY - dy * headLength + py * headWidth);
    ctx.lineTo(tipX - dx * headLength - px * headWidth, tipY - dy * headLength - py * headWidth);
    ctx.closePath();
    ctx.fill();

    // Fletching
    const featherX = stringPoint.x - dx * 7;
    const featherY = stringPoint.y - dy * 7;
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(featherX, featherY);
    ctx.lineTo(featherX - dx * 12 + px * 5, featherY - dy * 12 + py * 5);
    ctx.moveTo(featherX, featherY);
    ctx.lineTo(featherX - dx * 12 - px * 5, featherY - dy * 12 - py * 5);
    ctx.stroke();

    // Handle
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(launcher.x - px * 10, launcher.y - py * 10);
    ctx.lineTo(launcher.x + px * 10, launcher.y + py * 10);
    ctx.stroke();

    if (touching) {
        ctx.fillStyle = aimActive ? "rgba(255,255,255,.4)" : "rgba(255,49,88,.7)";
        ctx.font = "9px monospace";
        ctx.fillText(
            aimActive ? `POWER ${Math.round(eased * 100)}%` : "AIM OUT OF RANGE",
            launcher.x - 45,
            launcher.y + 50
        );

        ctx.beginPath();
        ctx.arc(launcher.x, launcher.y, AIM_ACTIVE_RADIUS, 0, Math.PI * 2);
        ctx.setLineDash([3, 7]);
        ctx.strokeStyle = aimActive ? "rgba(0,255,145,.14)" : "rgba(255,49,88,.28)";
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.moveTo(launcher.x, launcher.y);
        ctx.lineTo(currentTouchX, currentTouchY);
        ctx.strokeStyle = aimActive ? "rgba(255,255,255,.12)" : "rgba(255,49,88,.2)";
        ctx.stroke();
    }

    ctx.restore();
}

/* =========================================================
   TARGET DRAW
========================================================= */
function drawTarget() {
    targetFlash *= .92;
    ctx.save();

    ctx.strokeStyle = `rgba(0,255,145,${.12 + targetFlash * .4})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(target.x, target.y, target.radius + 16 + targetFlash * 10, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(target.x, target.y, target.radius + 5, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,.25)";
    ctx.stroke();

    ctx.shadowColor = "#00ff91";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    const r = target.radius;
    ctx.strokeStyle = "rgba(255,255,255,.18)";
    ctx.beginPath();
    ctx.moveTo(target.x - r - 16, target.y); ctx.lineTo(target.x - r - 5, target.y);
    ctx.moveTo(target.x + r + 5, target.y); ctx.lineTo(target.x + r + 16, target.y);
    ctx.moveTo(target.x, target.y - r - 16); ctx.lineTo(target.x, target.y - r - 5);
    ctx.moveTo(target.x, target.y + r + 5); ctx.lineTo(target.x, target.y + r + 16);
    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   SHOOT
========================================================= */
function shoot() {
    if (arrow || locked) return;
    shots++;

    const theta = currentAngle();
    const v = currentVelocity();
    const radians = theta * Math.PI / 180;

    arrow = {
        x: launcher.x,
        y: launcher.y,
        vx: v * Math.cos(radians),
        vy: -v * Math.sin(radians),
        time: 0,
        trail: []
    };

    sfx.twang(powerOf(v));
    document.getElementById("fire").textContent = "ARROW IN FLIGHT";
    updateStats();
    refreshToolbar();
}

/* =========================================================
   ARROW DRAW
========================================================= */
function drawArrow() {
    if (!arrow) return;

    const a = Math.atan2(arrow.vy, arrow.vx);
    const dx = Math.cos(a), dy = Math.sin(a);
    const px = -dy, py = dx;

    ctx.save();

    if (arrow.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(arrow.trail[0].x, arrow.trail[0].y);
        for (let i = 1; i < arrow.trail.length; i++) ctx.lineTo(arrow.trail[i].x, arrow.trail[i].y);
        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    ctx.shadowColor = "rgba(255,255,255,.5)";
    ctx.shadowBlur = 7;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(arrow.x - dx * 22, arrow.y - dy * 22);
    ctx.lineTo(arrow.x + dx * 17, arrow.y + dy * 17);
    ctx.stroke();
    ctx.shadowBlur = 0;

    const tipX = arrow.x + dx * 24, tipY = arrow.y + dy * 24;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - dx * 13 + px * 5, tipY - dy * 13 + py * 5);
    ctx.lineTo(tipX - dx * 13 - px * 5, tipY - dy * 13 - py * 5);
    ctx.closePath();
    ctx.fill();

    const rearX = arrow.x - dx * 16, rearY = arrow.y - dy * 16;
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(rearX, rearY);
    ctx.lineTo(rearX - dx * 10 + px * 6, rearY - dy * 10 + py * 6);
    ctx.moveTo(rearX, rearY);
    ctx.lineTo(rearX - dx * 10 - px * 6, rearY - dy * 10 - py * 6);
    ctx.stroke();

    ctx.restore();
}

/* =========================================================
   COLLISION / HIT / MISS
========================================================= */
function targetDistance() {
    const dx = arrow.x - target.x, dy = arrow.y - target.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function collision() {
    return targetDistance() < target.radius + 10;
}

function hit() {
    hits++;
    streak++;

    const precisionBonus = Math.max(0, Math.round((target.radius + 10 - targetDistance()) * 8));
    // CHANGED: level multiplier applied
    const gained = (100 + precisionBonus + streak * 20) * settings().multiplier;
    score += gained;
    updateStats();

    explode(target.x, target.y);
    targetFlash = 1;
    sfx.hit(streak);
    showMessage("HIT", `trajectory confirmed +${gained}`);

    arrow = null;
    document.getElementById("fire").textContent = "FIRE ARROW";
    refreshToolbar();
    locked = true;

    setTimeout(() => {
        placeTarget();
        locked = false;
        hideMessage();
    }, 550);
}

function miss() {
    streak = 0;
    updateStats();
    sfx.miss();
    showMessage("MISS", "recalculate trajectory");

    arrow = null;
    document.getElementById("fire").textContent = "FIRE ARROW";
    refreshToolbar();
    locked = true;

    setTimeout(() => {
        locked = false;
        hideMessage();
    }, 500);
}

/* =========================================================
   ARROW PHYSICS
========================================================= */
function updateArrow(dt) {
    if (!arrow) return;

    arrow.trail.push({ x: arrow.x, y: arrow.y });
    if (arrow.trail.length > 32) arrow.trail.shift();

    arrow.x += arrow.vx * dt;
    arrow.y += arrow.vy * dt;
    arrow.vy += GRAVITY * dt;
    arrow.time += dt;

    if (collision()) { hit(); return; }
    if (arrow.x > W + 80 || arrow.y > H + 80 || arrow.y < 65) miss();
}

/* =========================================================
   PARTICLES
========================================================= */
function explode(x, y) {
    for (let i = 0; i < 34; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 240;
        particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 1, size: 1 + Math.random() * 2.5 });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 130 * dt;
        p.life -= dt * 1.8;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = "#00ff91";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

/* =========================================================
   HUD
========================================================= */
function updateStats() {
    document.getElementById("score").textContent = String(score).padStart(4, "0");
    document.getElementById("streak").textContent = String(streak).padStart(2, "0");
    document.getElementById("accuracy").textContent =
        shots === 0 ? "100%" : Math.round(hits / shots * 100) + "%";
}

/* =========================================================
   MESSAGE
========================================================= */
let messageTimeout;

function showMessage(main, sub) {
    clearTimeout(messageTimeout);
    const mainElement = document.getElementById("messageMain");
    mainElement.textContent = main;
    document.getElementById("messageSub").textContent = sub;
    mainElement.style.color = main === "HIT" ? "#00ff91" : main === "MISS" || main === "OUT OF RANGE" ? "#ff3158" : "#fff";
    document.getElementById("message").classList.add("show");
}

function hideMessage() {
    messageTimeout = setTimeout(() => {
        document.getElementById("message").classList.remove("show");
    }, 80);
}

/* =========================================================
   DRAW + LOOP
========================================================= */
function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = "#101010";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, launcher.y);
    ctx.lineTo(W, launcher.y);
    ctx.stroke();

    ctx.fillStyle = "#292929";
    ctx.font = "9px monospace";
    ctx.fillText("x₀", launcher.x - 4, launcher.y + 25);

    drawPrediction();
    drawTarget();
    drawBow();
    drawArrow();
    drawParticles();
}

function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, .025);
    lastTime = now;
    clock += dt;
    updateTarget();
    updateArrow(dt);
    updateParticles(dt);
    draw();
    requestAnimationFrame(loop);
}

/* =========================================================
   DESKTOP FIRE + KEYBOARD
========================================================= */
document.getElementById("fire").addEventListener("click", shoot);

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        shoot();
        return;
    }

    // NEW: 1 / 2 / 3 pick a level, M toggles sound
    if (e.code === "Digit1") setLevel("easy");
    if (e.code === "Digit2") setLevel("normal");
    if (e.code === "Digit3") setLevel("hard");
    if (e.code === "KeyM") toggleSound();

    if (e.code === "ArrowUp") angleSlider.value = Math.min(MAX_ANGLE, Number(angleSlider.value) + 1);
    if (e.code === "ArrowDown") angleSlider.value = Math.max(MIN_ANGLE, Number(angleSlider.value) - 1);
    if (e.code === "ArrowRight") velocitySlider.value = Math.min(MAX_VELOCITY, Number(velocitySlider.value) + 25);
    if (e.code === "ArrowLeft") velocitySlider.value = Math.max(MIN_VELOCITY, Number(velocitySlider.value) - 25);
    updateControls();
});

/* =========================================================
   START
========================================================= */
updateControls();
resize();
updateStats();
refreshToolbar();
requestAnimationFrame(loop);
</script>
</body>
